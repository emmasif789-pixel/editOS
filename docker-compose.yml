version: "3.8"

services:
  editos-api:
    build: .
    ports: ["8000:8000"]
    volumes: ["editos_data:/data"]
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:1b
    depends_on: [ollama]

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama_models:/root/.ollama"]

volumes:
  editos_data:
  ollama_models:
