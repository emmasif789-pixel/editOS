<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EditOS — Post-production, automated</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================= TOKENS ============================= */
/* Dark (default) */
:root{
  --void:#0B0C0D;
  --surface:#141617;
  --surface-2:#1A1D1E;
  --surface-3:#212423;
  --line:rgba(245,245,242,.06);
  --line-strong:#272A29;
  --bone:#F5F5F2;
  --bone-dim:#969B98;
  --fog:#686C69;
  --signal:#C8FF3D;
  --signal-dark:#91C51F;
  --signal-dim:rgba(200,255,61,.10);
  --signal-ink:#C8FF3D;
  --ink-on-lime:#10130A;
  --indigo:#87888C;
  --indigo-dim:rgba(135,136,140,.08);
  --ember:#AD6248;
  --ember-dim:rgba(173,98,72,.14);
  --radius:8px;
  --radius-lg:12px;
  --ease:cubic-bezier(.22,1,.36,1);
}
/* Light */
html[data-theme="light"]{
  --void:#FAFAF7;
  --surface:#FFFFFF;
  --surface-2:#F3F3EF;
  --surface-3:#EAEAE4;
  --line:rgba(11,12,13,.07);
  --line-strong:#DEDED6;
  --bone:#14171A;
  --bone-dim:#5B5F5A;
  --fog:#8A8E86;
  --signal-dim:rgba(145,197,31,.13);
  --signal-ink:#5C7A16;
  --indigo:#9A9C95;
  --indigo-dim:rgba(154,156,149,.10);
}
html{ transition:background-color .35s var(--ease); }
body, .topbar, .panel, .side-card, .dropzone, .improve-card, .player-shell, .scope-panel, .revise-panel{
  transition:background-color .3s var(--ease), border-color .3s var(--ease), color .3s var(--ease);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--void);
  color:var(--bone);
  font-family:'Inter',sans-serif;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  position:relative;
}
::selection{background:var(--signal); color:var(--void);}
::-webkit-scrollbar{width:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--surface-3); border-radius:8px;}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
.mono{font-family:'IBM Plex Mono',monospace; letter-spacing:-0.01em;}
.display{font-family:'Syne',sans-serif;}
:focus-visible{outline:1.5px solid var(--signal); outline-offset:2px; border-radius:4px;}

/* ============================= BACKGROUND ============================= */
/* A quiet, static vignette — no motion, no bloom. Depth comes from the panel
   grid and hairline rules, the way a real grading suite reads. */
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(1100px 620px at 50% -8%, rgba(255,255,255,.035), transparent 60%),
    radial-gradient(900px 700px at 100% 100%, rgba(0,0,0,.5), transparent 60%);
}
body::after{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.4;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px);
  background-size:100% 44px;
  mask-image:linear-gradient(to bottom, black, transparent 70%);
}

/* ============================= LAYOUT SHELL ============================= */
#app{ position:relative; z-index:2; min-height:100vh; display:flex; flex-direction:column; }

.topbar{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
  padding:18px clamp(20px,4vw,56px); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  background:rgba(11,11,12,.82); border-bottom:1px solid var(--line);
}
.wordmark{ display:flex; align-items:baseline; gap:8px; font-family:'Syne',sans-serif; font-weight:800; font-size:16px; letter-spacing:.05em;}
.topbar-right{ display:flex; align-items:center; gap:16px; }
.backend-badge{
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
  padding:5px 10px; border-radius:6px; border:1px solid var(--line-strong); color:var(--fog); background:var(--surface-2);
}
.backend-badge.on{ color:var(--signal-ink); border-color:rgba(78,158,133,.35); background:var(--signal-dim); }
.backend-badge.off{ color:var(--fog); }
.theme-toggle{
  position:relative; width:34px; height:34px; border-radius:8px; border:1px solid var(--line-strong);
  background:var(--surface-2); color:var(--bone-dim); display:flex; align-items:center; justify-content:center;
  transition:background .2s var(--ease), border-color .2s var(--ease), color .2s var(--ease);
}
.theme-toggle:hover{ color:var(--bone); border-color:var(--fog); }
.theme-toggle svg{ width:16px; height:16px; position:absolute; transition:opacity .25s var(--ease), transform .25s var(--ease); }
.theme-toggle .i-sun{ opacity:0; transform:rotate(-40deg) scale(.6); }
.theme-toggle .i-moon{ opacity:1; transform:rotate(0) scale(1); }
html[data-theme="light"] .theme-toggle .i-sun{ opacity:1; transform:rotate(0) scale(1); }
html[data-theme="light"] .theme-toggle .i-moon{ opacity:0; transform:rotate(40deg) scale(.6); }

.stage-track{ display:flex; align-items:center; gap:7px; }
.stage-track .seg{ width:22px; height:2px; border-radius:1px; background:var(--surface-3); transition:background .5s var(--ease), width .5s var(--ease); }
.stage-track .seg.done{ background:var(--signal); }
.stage-track .seg.active{ background:var(--bone); width:32px; }

.stage-label{ font-size:11px; color:var(--fog); font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.09em; }

.scene{ flex:1; display:flex; flex-direction:column; }

.scene-enter{ animation:sceneIn .5s var(--ease) both; }
@keyframes sceneIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

.container{ max-width:1180px; margin:0 auto; width:100%; padding:0 clamp(20px,4vw,56px); }

/* ============================= BUTTONS ============================= */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border:1px solid var(--line-strong); background:var(--surface-2); color:var(--bone);
  padding:12px 20px; border-radius:8px; font-size:13.5px; font-weight:600; letter-spacing:-.005em;
  transition:transform .2s var(--ease), background .2s var(--ease), border-color .2s var(--ease);
  white-space:nowrap;
}
.btn:hover{ border-color:var(--line-strong); background:var(--surface-3); }
.btn:active{ transform:scale(.98); }
.btn-primary{
  background:var(--bone); color:var(--void); border-color:var(--bone);
}
.btn-primary:hover{ background:#fff; }
.btn-signal{ background:var(--signal); color:var(--ink-on-lime); border-color:var(--signal); }
.btn-signal:hover{ background:var(--signal-dark); }
.btn:disabled{ opacity:.35; pointer-events:none; }
.btn-ghost{ background:transparent; border-color:transparent; color:var(--fog); padding:12px 14px; }
.btn-ghost:hover{ color:var(--bone); background:var(--surface); }
.btn svg{ width:15px; height:15px; }

/* ============================= LANDING ============================= */
.hero{ min-height:calc(100vh - 84px); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 20px 100px; }
.eyebrow{
  display:inline-flex; align-items:center; gap:8px; font-family:'IBM Plex Mono',monospace; font-size:12px;
  color:var(--bone-dim); border:1px solid var(--line-strong); background:transparent; padding:6px 13px; border-radius:6px;
  letter-spacing:.04em; margin-bottom:28px; animation:sceneIn .8s var(--ease) both;
}
.eyebrow .dot2{ width:5px; height:5px; border-radius:50%; background:var(--signal); }
.hero h1{
  font-family:'Syne',sans-serif; font-weight:700; letter-spacing:-.02em; line-height:1.0;
  font-size:clamp(42px,7.4vw,92px); max-width:1000px; animation:sceneIn .9s .05s var(--ease) both;
}
.hero h1 .accent{ color:var(--signal-ink); font-style:normal; }
.hero p.sub{
  margin-top:26px; font-size:clamp(16px,1.6vw,19px); color:var(--fog); max-width:560px; line-height:1.6;
  animation:sceneIn .9s .12s var(--ease) both;
}
.hero-cta{ margin-top:44px; display:flex; gap:14px; align-items:center; animation:sceneIn .9s .2s var(--ease) both;}
.hero-meta{ margin-top:60px; display:flex; gap:38px; flex-wrap:wrap; justify-content:center; animation:sceneIn .9s .3s var(--ease) both;}
.hero-meta .m{ text-align:left; }
.hero-meta .m .k{ font-family:'Syne',sans-serif; font-size:26px; font-weight:700; }
.hero-meta .m .l{ font-size:12px; color:var(--fog); margin-top:2px; font-family:'IBM Plex Mono',monospace; letter-spacing:.03em;}

.orb-wrap{ position:relative; width:100%; display:flex; justify-content:center; margin-top:56px; animation:sceneIn 1s .35s var(--ease) both;}
.ring-canvas{ width:min(560px,86vw); height:200px; }

/* ============================= UPLOAD ============================= */
.head-block{ padding:56px 0 8px; }
.head-block .step-eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--signal-ink); text-transform:uppercase; letter-spacing:.1em; margin-bottom:14px; display:block;}
.head-block h2{ font-family:'Syne',sans-serif; font-size:clamp(26px,3.4vw,40px); font-weight:600; letter-spacing:-.02em; max-width:640px;}
.head-block p{ color:var(--fog); margin-top:12px; max-width:560px; line-height:1.6; font-size:15px;}

.drop-grid{ display:grid; grid-template-columns:1.2fr .8fr; gap:20px; margin:36px 0 20px; }
@media(max-width:820px){ .drop-grid{ grid-template-columns:1fr; } }

.dropzone{
  position:relative; border:1.5px dashed var(--line-strong); border-radius:var(--radius-lg); background:var(--surface);
  padding:34px 26px; min-height:230px; display:flex; flex-direction:column; transition:border-color .25s var(--ease), background .25s var(--ease), transform .25s var(--ease);
  overflow:hidden;
}
.dropzone.drag{ border-color:var(--signal); background:var(--signal-dim); transform:scale(1.01); }
.dropzone .dz-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.dropzone .dz-title{ font-weight:600; font-size:15px; display:flex; align-items:center; gap:8px;}
.tag-pill{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; padding:3px 8px; border-radius:4px; letter-spacing:.06em; text-transform:uppercase;}
.tag-pill.req{ background:var(--ember-dim); color:var(--ember); }
.tag-pill.opt{ background:var(--indigo-dim); color:var(--indigo); }
.dz-empty{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:12px; color:var(--fog); }
.dz-empty svg{ width:34px; height:34px; opacity:.6; }
.dz-empty .hint{ font-size:13px; }
.dz-empty .browse{ color:var(--signal-ink); text-decoration:underline; text-underline-offset:3px; cursor:pointer;}
.dz-empty small{ font-size:11.5px; color:var(--fog); opacity:.7;}

.file-chip{
  display:flex; align-items:center; gap:12px; background:var(--surface-2); border:1px solid var(--line); border-radius:12px;
  padding:10px 12px; margin-bottom:8px; animation:sceneIn .4s var(--ease) both;
}
.file-chip video{ width:52px; height:38px; object-fit:cover; border-radius:6px; background:#000; flex-shrink:0;}
.file-chip .fc-meta{ flex:1; min-width:0; }
.file-chip .fc-name{ font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.file-chip .fc-sub{ font-size:11.5px; color:var(--fog); font-family:'IBM Plex Mono',monospace; margin-top:2px;}
.file-chip .fc-remove{ color:var(--fog); background:none; border:none; padding:6px; border-radius:8px; }
.file-chip .fc-remove:hover{ color:var(--ember); background:var(--ember-dim); }
.file-list{ flex:1; overflow-y:auto; }

.section-block{ margin:44px 0; }
.field-label{ font-family:'IBM Plex Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--fog); display:block; margin-bottom:12px;}
textarea.goal-input{
  width:100%; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); color:var(--bone);
  padding:18px 20px; font-size:15.5px; font-family:'Inter',sans-serif; resize:none; min-height:96px; line-height:1.6;
  transition:border-color .25s var(--ease), background .25s var(--ease);
}
textarea.goal-input:focus{ outline:none; border-color:var(--signal); background:var(--surface-2); }
textarea.goal-input::placeholder{ color:var(--fog); }

.intent-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
@media(max-width:900px){ .intent-grid{ grid-template-columns:repeat(2,1fr);} }
.intent-card{
  position:relative; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 16px; transition:all .22s var(--ease); overflow:hidden;
}
.intent-card:hover{ border-color:var(--line-strong); transform:translateY(-3px); }
.intent-card.active{ border-color:var(--signal); background:var(--signal-dim); box-shadow:0 0 0 1px var(--signal) inset; }
.intent-card .ic-icon{ font-size:19px; margin-bottom:10px; display:block;}
.intent-card .ic-name{ font-weight:600; font-size:14px; }
.intent-card .ic-desc{ font-size:11.5px; color:var(--fog); margin-top:4px; line-height:1.4;}

.bottom-bar{
  position:sticky; bottom:0; z-index:15; margin-top:40px; padding:18px clamp(20px,4vw,56px);
  display:flex; align-items:center; justify-content:space-between; backdrop-filter:blur(14px);
  background:linear-gradient(to top, rgba(10,11,13,.9), rgba(10,11,13,0)); border-top:1px solid var(--line);
}
.bottom-bar .hint-txt{ font-size:13px; color:var(--fog); }

/* ============================= ANALYZING ============================= */
.analyze-wrap{ padding:56px 0 100px; }
.analyze-grid{ display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:34px; }
@media(max-width:900px){ .analyze-grid{ grid-template-columns:1fr; } }
.panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:26px; min-height:380px; display:flex; flex-direction:column;}
.panel-head{ display:flex; align-items:center; gap:10px; margin-bottom:20px; }
.panel-head .ph-icon{ width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px;}
.panel-head .ph-icon.sig{ background:var(--signal-dim); }
.panel-head .ph-icon.ind{ background:var(--indigo-dim); }
.panel-head .ph-title{ font-weight:600; font-size:15px; }
.panel-head .ph-sub{ font-size:11.5px; color:var(--fog); font-family:'IBM Plex Mono',monospace;}

.stream-line{
  display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px;
  opacity:0; animation:lineIn .5s var(--ease) forwards;
}
.stream-line:last-child{ border-bottom:none; }
.stream-line .sl-check{ color:var(--signal-ink); flex-shrink:0; margin-top:1px; }
.stream-line .sl-txt{ color:var(--bone-dim); line-height:1.5; }
.stream-line .sl-txt b{ color:var(--bone); font-weight:600;}
@keyframes lineIn{ from{opacity:0; transform:translateX(-6px);} to{opacity:1; transform:translateX(0);} }

.cursor-blink{ display:inline-block; width:7px; height:14px; background:var(--signal); margin-left:2px; animation:blink 1s steps(1) infinite; vertical-align:middle;}
@keyframes blink{ 50%{opacity:0;} }

.pulse-canvas-wrap{ display:flex; align-items:center; justify-content:center; flex:1; }
.dna-tags{ display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; }
.dna-tag{
  font-size:11.5px; padding:6px 11px; border-radius:5px; background:var(--surface-2); color:var(--bone-dim);
  font-family:'IBM Plex Mono',monospace; opacity:0; animation:lineIn .45s var(--ease) forwards; border:1px solid var(--line-strong);
}

.progress-track{ height:4px; background:var(--surface-2); border-radius:4px; overflow:hidden; margin-top:30px;}
.progress-fill{ height:100%; background:linear-gradient(90deg,var(--signal),var(--indigo)); border-radius:4px; transition:width .4s var(--ease); }
.progress-caption{ display:flex; justify-content:space-between; margin-top:10px; font-size:12px; color:var(--fog); font-family:'IBM Plex Mono',monospace;}

/* ============================= PLAN ============================= */
.plan-wrap{ padding:56px 0 40px; }
.plan-layout{ display:grid; grid-template-columns:1.3fr .95fr; gap:26px; margin-top:32px; align-items:start;}
@media(max-width:960px){ .plan-layout{ grid-template-columns:1fr; } }

.beat{ display:flex; gap:16px; padding:18px 0; border-bottom:1px solid var(--line); position:relative;}
.beat:last-child{ border-bottom:none; }
.beat .beat-rail{ display:flex; flex-direction:column; align-items:center; flex-shrink:0; width:14px;}
.beat .beat-dot{ width:10px; height:10px; border-radius:50%; background:var(--signal); box-shadow:0 0 0 4px var(--signal-dim); flex-shrink:0; margin-top:5px;}
.beat .beat-line{ flex:1; width:1.5px; background:var(--line-strong); margin-top:6px;}
.beat-body{ flex:1; }
.beat-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.beat-name{ font-weight:600; font-size:15.5px; font-family:'Syne',sans-serif; }
.beat-time{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--signal-ink); background:var(--signal-dim); padding:3px 8px; border-radius:4px; flex-shrink:0; border:1px solid var(--line-strong);}
.beat-why{ font-size:13.5px; color:var(--fog); margin-top:6px; line-height:1.55; max-width:520px;}

.side-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:24px; margin-bottom:18px;}
.side-card h3{ font-family:'Syne',sans-serif; font-size:15px; font-weight:600; margin-bottom:16px; display:flex; align-items:center; gap:8px;}
.decision-row{ display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:13px; align-items:flex-start;}
.decision-row:last-child{ border-bottom:none; }
.decision-row svg{ width:15px; height:15px; color:var(--signal-ink); flex-shrink:0; margin-top:2px;}
.decision-row .d-txt b{ color:var(--bone); font-weight:600;}
.decision-row .d-txt{ color:var(--bone-dim); line-height:1.5;}

.chat-box{ display:flex; flex-direction:column; gap:10px;}
.chat-msgs{ display:flex; flex-direction:column; gap:10px; margin-bottom:14px; max-height:220px; overflow-y:auto;}
.chat-bubble{ padding:10px 14px; border-radius:14px; font-size:13px; line-height:1.5; animation:lineIn .35s var(--ease) both;}
.chat-bubble.user{ background:var(--surface-3); align-self:flex-end; border-bottom-right-radius:4px; max-width:88%;}
.chat-bubble.agent{ background:var(--surface-3); color:var(--bone); align-self:flex-start; border-bottom-left-radius:4px; max-width:92%; border:1px solid var(--line-strong);}
.chat-suggest{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
.chip-sm{ font-size:11.5px; padding:6px 11px; border-radius:6px; background:var(--surface-2); border:1px solid var(--line); color:var(--bone-dim); transition:all .2s;}
.chip-sm:hover{ border-color:var(--signal); color:var(--signal-ink); }
.chat-input-row{ display:flex; gap:8px; }
.chat-input{ flex:1; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius); padding:10px 14px; color:var(--bone); font-size:13px;}
.chat-input:focus{ outline:none; border-color:var(--signal); }
.chat-send{ width:38px; height:38px; border-radius:50%; background:var(--signal); border:none; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.chat-send svg{ width:16px; height:16px; color:var(--ink-on-lime);}
.chat-send:disabled{ opacity:.3; }

/* ============================= RENDERING ============================= */
.render-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px; text-align:center;}
.scope-panel{
  position:relative; width:min(360px,82vw); height:150px; margin-bottom:40px;
  border:1px solid var(--line-strong); border-radius:var(--radius-lg); background:var(--surface); overflow:hidden;
}
.scope-panel canvas{ width:100%; height:100%; display:block; }
.scope-label{
  position:absolute; top:12px; left:14px; display:flex; align-items:center; gap:7px;
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.1em; color:var(--fog); text-transform:uppercase;
}
.scope-label .scope-dot{ width:6px; height:6px; border-radius:50%; background:var(--signal); }
.scope-readout{
  position:absolute; top:12px; right:14px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--bone-dim); letter-spacing:.02em;
}

.render-wrap h2{ font-family:'Syne',sans-serif; font-size:clamp(24px,3vw,32px); font-weight:600;}
.render-wrap p{ color:var(--fog); margin-top:10px; font-size:14.5px;}

.task-list{ margin-top:40px; width:100%; max-width:480px; text-align:left;}
.task-row{ display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); font-size:13.5px; color:var(--fog); transition:color .3s;}
.task-row:last-child{ border-bottom:none;}
.task-row.active{ color:var(--bone); }
.task-row.done{ color:var(--bone-dim); }
.task-check{ width:20px; height:20px; border-radius:50%; border:1.5px solid var(--line-strong); flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all .3s;}

/* ---------------- helpers ---------------- */
function fmtTime(s){
  s = Math.max(0, Math.round(s));
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
function seedRandom(seed){

/* ============================================================
   REAL ANALYSIS + EXPORT ENGINE
   Everything below actually decodes audio, samples real video
   frames, and re-encodes a genuinely shorter file — no fabricated
   numbers past this point.
   ============================================================ */
function supportsExport(){
  return typeof HTMLVideoElement !== 'undefined' &&
    !!(HTMLVideoElement.prototype.captureStream || HTMLVideoElement.prototype.mozCaptureStream) &&
    typeof MediaRecorder !== 'undefined';
}

function seekTo(video, t){
  return new Promise(resolve=>{
    const onSeeked = ()=>{ video.removeEventListener('seeked', onSeeked); resolve(); };
    video.addEventListener('seeked', onSeeked);
    try{ video.currentTime = Math.max(0, t); }catch(e){ resolve(); }
  });
}
function waitUntilTime(video, endTime){
  return new Promise(resolve=>{
    let done=false;
    function finish(){ if(done) return; done=true; video.removeEventListener('timeupdate', check); resolve(); }
    function check(){ if(video.currentTime>=endTime-0.03 || video.ended) finish(); }
    video.addEventListener('timeupdate', check);
    function raf(){ if(done) return; if(video.paused){ requestAnimationFrame(raf); return; } if(video.currentTime>=endTime-0.03){ finish(); return; } requestAnimationFrame(raf); }
    requestAnimationFrame(raf);
    setTimeout(finish, Math.max(300,(endTime-video.currentTime)*1000+1500)); // safety timeout
  });
}

/* Real silence detection — decodes the actual audio track and
   measures RMS energy in 50ms windows to find genuine dead air. */
async function analyzeSilence(fileEntry, opts){
  const sensitivity = (opts && opts.thresholdMult) || 0.22;
  const minDur = (opts && opts.minDur) || 0.55;
  try{
    const arrayBuf = await fileEntry.file.arrayBuffer();
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC();
    let audioBuffer;
    try{ audioBuffer = await ctx.decodeAudioData(arrayBuf); }
    catch(e){ ctx.close(); fileEntry.silences=[]; fileEntry.peak=1; fileEntry.noAudio=true; return; }
    const data = audioBuffer.getChannelData(0);
    const sr = audioBuffer.sampleRate;
    const win = Math.max(1, Math.round(sr*0.05));
    const rmsList = []; let peak = 0;
    for(let i=0;i<data.length;i+=win){
      const end = Math.min(i+win, data.length);
      let sum=0, localPeak=0;
      for(let j=i;j<end;j++){ const v=data[j]; sum+=v*v; const av=Math.abs(v); if(av>localPeak) localPeak=av; }
      rmsList.push(Math.sqrt(sum/(end-i)));
      if(localPeak>peak) peak=localPeak;
    }
    const avgRms = rmsList.reduce((a,b)=>a+b,0)/(rmsList.length||1);
    const threshold = Math.max(avgRms*sensitivity, 0.006);
    const winDur = win/sr, minSilenceDur=minDur, pad=0.10;
    let silences=[], runStart=null;
    for(let i=0;i<rmsList.length;i++){
      const t = i*winDur;
      if(rmsList[i] < threshold){ if(runStart===null) runStart=t; }
      else if(runStart!==null){
        if(t-runStart>=minSilenceDur) silences.push({start:runStart+pad, end:t-pad});
        runStart=null;
      }
    }
    if(runStart!==null){
      const end = rmsList.length*winDur;
      if(end-runStart>=minSilenceDur) silences.push({start:runStart+pad, end:end-pad});
    }
    silences = silences.filter(s=>s.end>s.start);
    if(silences.length>10){
      silences = silences.map(s=>({...s,len:s.end-s.start})).sort((a,b)=>b.len-a.len).slice(0,10).sort((a,b)=>a.start-b.start);
    }
    ctx.close();
    fileEntry.silences = silences;
    fileEntry.peak = peak || 1;
    fileEntry.realDuration = audioBuffer.duration;
  }catch(e){
    console.error('silence analysis failed', e);
    fileEntry.silences = []; fileEntry.peak = 1; fileEntry.noAudio = true;
  }
}

/* Real reference-cut detection — samples actual frames from the
   reference video and measures pixel-level change between them to
   find real hard cuts, giving a genuine cuts/min and shot-length. */
function analyzeReferenceRhythm(refEntry, onProgress){
  return new Promise((resolve)=>{
    const video = document.createElement('video');
    video.muted = true; video.preload='auto'; video.playsInline = true;
    video.style.position='fixed'; video.style.left='-9999px'; video.style.top='0'; video.style.width='4px'; video.style.height='4px';
    document.body.appendChild(video);
    const cleanup = ()=>{ try{ document.body.removeChild(video); }catch(e){} };
    const onMeta = async ()=>{
      const duration = video.duration || 0;
      if(!duration || !isFinite(duration)){ cleanup(); resolve({cuts:[], cutsPerMin:0, avgShotLen:0}); return; }
      const samples = Math.min(140, Math.max(20, Math.floor(duration*3)));
      const step = duration/samples;
      const canvas = document.createElement('canvas'); canvas.width=48; canvas.height=27;
      const ctx = canvas.getContext('2d', {willReadFrequently:true});
      let prev=null; const cuts=[];
      for(let i=0;i<samples;i++){
        const t = Math.min(duration-0.05, i*step);
        await seekTo(video, t);
        try{ ctx.drawImage(video,0,0,48,27); }catch(e){}
        const frame = ctx.getImageData(0,0,48,27).data;
        if(prev){
          let diff=0;
          for(let p=0;p<frame.length;p+=4) diff += Math.abs(frame[p]-prev[p])+Math.abs(frame[p+1]-prev[p+1])+Math.abs(frame[p+2]-prev[p+2]);
          diff = diff/(48*27*3);
          if(diff>28) cuts.push(Math.round(t*10)/10);
        }
        prev = frame;
        if(onProgress) onProgress(i+1, samples);
      }
      cleanup();
      const cutsPerMin = duration>0 ? Math.round((cuts.length/(duration/60))*10)/10 : 0;
      const avgShotLen = cuts.length>0 ? Math.round((duration/(cuts.length+1))*10)/10 : Math.round(duration*10)/10;
      resolve({cuts, cutsPerMin, avgShotLen});
    };
    video.addEventListener('loadedmetadata', onMeta, {once:true});
    video.src = refEntry.url; video.load();
  });
}

function computeKeepSegments(duration, silences){
  const segs=[]; let cursor=0;
  for(const s of (silences||[])){
    if(s.start>cursor+0.05) segs.push({start:cursor, end:s.start});
    cursor = Math.max(cursor, s.end);
  }
  if(duration-cursor>0.05) segs.push({start:cursor, end:duration});
  return segs.filter(s=>s.end-s.start>0.12);
}

/* Real export — plays only the kept segments of each real clip in
   order, capturing actual frames + gain-adjusted audio via
   MediaRecorder into a genuinely shorter, playable/downloadable file. */
async function exportEditedVideos(fileEntries, onProgress){
  const video = document.createElement('video');
  video.playsInline = true; video.preload='auto';
  video.style.position='fixed'; video.style.left='-9999px'; video.style.top='0'; video.style.width='4px'; video.style.height='4px';
  document.body.appendChild(video);

  const AC = window.AudioContext || window.webkitAudioContext;
  const audioCtx = new AC();
  const dest = audioCtx.createMediaStreamDestination();
  const gainNode = audioCtx.createGain();
  gainNode.connect(dest);
  let sourceNode = null;

  function attachSource(){
    if(sourceNode){ try{ sourceNode.disconnect(); }catch(e){} }
    sourceNode = audioCtx.createMediaElementSource(video);
    sourceNode.connect(gainNode);
  }
  function loadFile(url){
    return new Promise(resolve=>{
      const h = ()=>{ video.removeEventListener('loadedmetadata', h); resolve(); };
      video.addEventListener('loadedmetadata', h, {once:true});
      video.src = url; video.load();
    });
  }

  await loadFile(fileEntries[0].url);
  attachSource();

  const capture = video.captureStream ? video.captureStream() : video.mozCaptureStream();
  const videoTrack = capture.getVideoTracks()[0];
  const combined = new MediaStream([videoTrack, ...dest.stream.getAudioTracks()]);
  const mimeCandidates = ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  const mime = mimeCandidates.find(m=> window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m));
  const recorder = new MediaRecorder(combined, mime?{mimeType:mime}:undefined);
  const chunks = [];
  recorder.ondataavailable = e=>{ if(e.data && e.data.size>0) chunks.push(e.data); };

  const totalSegs = fileEntries.reduce((a,f)=>a+(f.keepSegments?f.keepSegments.length:0),0) || 1;
  let doneSegs=0, started=false;

  for(let fi=0; fi<fileEntries.length; fi++){
    const fe = fileEntries[fi];
    if(fi>0){ await loadFile(fe.url); attachSource(); }
    gainNode.gain.value = fe.gain || 1;
    const segs = (fe.keepSegments && fe.keepSegments.length) ? fe.keepSegments : [{start:0, end:fe.realDuration||fe.duration||0}];
    for(const seg of segs){
      await seekTo(video, seg.start);
      if(!started){ recorder.start(); started=true; } else { recorder.resume(); }
      try{ await video.play(); }catch(e){}
      await waitUntilTime(video, seg.end);
      video.pause();
      recorder.pause();
      doneSegs++;
      if(onProgress) onProgress(doneSegs, totalSegs);
    }
  }

  const finalBlob = await new Promise(resolve=>{
    recorder.onstop = ()=> resolve(new Blob(chunks, {type:'video/webm'}));
    if(recorder.state!=='inactive') recorder.stop(); else resolve(new Blob(chunks,{type:'video/webm'}));
  });

  try{ document.body.removeChild(video); }catch(e){}
  try{ audioCtx.close(); }catch(e){}
  return { url: URL.createObjectURL(finalBlob), blob: finalBlob };
}

function render(){
  const scene = document.getElementById('scene');
  scene.classList.remove('scene-enter');
  void scene.offsetWidth;

function drawIdleWave(canvas){
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  function size(){
    const r = canvas.getBoundingClientRect();
    canvas.width = r.width*dpr; canvas.height = r.height*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  size();
  const bars = 64;
  const rnd = seedRandom(42);
  const base = Array.from({length:bars}, ()=> 0.2+rnd()*0.8);
  let t=0;
  function frame(){
    if(!document.body.contains(canvas)) return;
    const w = canvas.getBoundingClientRect().width, h = canvas.getBoundingClientRect().height;
    ctx.clearRect(0,0,w,h);
    const gap = w/bars;
    for(let i=0;i<bars;i++){
      const amp = base[i]*0.5 + 0.5*Math.sin(t*0.04 + i*0.35)*0.5+0.5;
      const bh = 6 + amp*(h*0.7);
      const x = i*gap+gap*0.25;
      const alpha = 0.18 + amp*0.72;
      ctx.fillStyle = `rgba(200,255,61,${alpha.toFixed(2)})`;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x, h/2-bh/2, gap*0.5, bh, 3) : ctx.rect(x, h/2-bh/2, gap*0.5, bh);
      ctx.fill();
    }
    t++;
    requestAnimationFrame(frame);
  }
  frame();
  window.addEventListener('resize', size);
}

}

async function runAnalyzingSequenceBackend({logFootage, logDna, addTag, setProgress}){
  setProgress(5, 'Uploading to backend…');
  logFootage(`Connected to real backend — <b>FFmpeg + OpenCV</b> will do this analysis, not the browser`);
  try{
    const form = new FormData();
    state.rawFiles.forEach(f=> form.append('raw', f.file, f.name));
    if(state.refFile) form.append('reference', state.refFile.file, state.refFile.name);

    const upRes = await fetch(BACKEND_URL+'/upload', {method:'POST', body: form});
    if(!upRes.ok) throw new Error('upload failed: '+upRes.status);
    const upData = await upRes.json();
    state.backendJobId = upData.job_id;
    setProgress(30, 'Analyzing on backend…');
    logFootage(`Uploaded <b>${upData.raw_files} clip(s)</b> to the backend`);

    const anRes = await fetch(BACKEND_URL+'/analyze', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({job_id: state.backendJobId, intent: state.intent})
    });
    if(!anRes.ok) throw new Error('analyze failed: '+anRes.status);
    const an = await anRes.json();

    state.totalDuration = an.total_duration;
    state.totalSilenceGaps = an.total_silence_gaps;
    state.totalSilenceTime = an.total_silence_time;
    state.rawFiles.forEach((f,i)=>{
      const bf = an.files[i];
      if(bf){ f.silences = bf.silences || []; f.realDuration = bf.duration; }
    });
    const loudVals = an.files.map(f=>f.loudness && f.loudness.input_i).filter(v=>v!=null);
    const avgLoud = loudVals.length ? loudVals.reduce((a,b)=>a+b,0)/loudVals.length : null;
    state.gainDb = avgLoud!=null ? Math.max(-6, Math.min(12, -16-avgLoud)) : 0;

    logFootage(`Real silence detection (ffmpeg silencedetect): <b>${an.total_silence_gaps} gap${an.total_silence_gaps===1?'':'s'}</b>, ${an.total_silence_time.toFixed(1)}s of dead air`);
    logFootage(`Real loudness measurement (EBU R128): applying <b>${state.gainDb.toFixed(1)}dB</b> gain to normalize`);
    setProgress(65, state.hasRef ? 'Reading reference…' : 'Finishing up…');

    if(state.hasRef && an.reference_stats){
      const rs = an.reference_stats;
      state.refStats = {cuts: rs.cuts||[], cutsPerMin: rs.cuts_per_min, avgShotLen: rs.avg_shot_len};
      logDna(`Real OpenCV cut detection — <b>${state.refStats.cuts.length} cuts</b> found in your reference`);
      logDna(`Average shot length: <b>${state.refStats.avgShotLen.toFixed(1)}s</b> · ~<b>${state.refStats.cutsPerMin}</b> cuts/min`);
      addTag(state.refStats.avgShotLen<2.2 ? 'Fast cuts (measured)' : state.refStats.avgShotLen<4 ? 'Moderate cuts (measured)' : 'Long takes (measured)');
      addTag(`${state.refStats.cutsPerMin} cuts/min (measured)`);
    } else if(state.hasRef){
      logDna('Reference supplied but backend returned no measurement — falling back to default pacing');
    } else {
      logDna('No reference supplied');
      logDna(`Using EditOS's default pacing for <b>${INTENTS.find(i=>i.id===state.intent)?.name}</b>`);
    }

    state.styleDNA = buildStyleDNA();
    setProgress(85, 'Asking local AI to reason about the plan…');
    try{
      const planRes = await fetch(BACKEND_URL+'/plan', {method:'POST', body: new URLSearchParams({job_id: state.backendJobId})});
      if(planRes.ok){
        const planData = await planRes.json();
        state.planReasoning = planData.reasoning;
      } else {
        state.planReasoning = null;
      }
    }catch(e){ state.planReasoning = null; }

    setProgress(100, 'Analysis complete');
    setTimeout(()=>{ buildPlan(); setStage('plan'); }, 500);
  }catch(err){
    console.error('backend analysis failed, falling back to browser', err);
    logFootage(`Backend call failed (${err.message}) — falling back to in-browser analysis`);
    state.backendAvailable = false;
    renderTopbar();
    await runAnalyzingSequenceBrowser({logFootage, logDna, addTag, setProgress});
  }
}

async function runAnalyzingSequenceBrowser({logFootage, logDna, addTag, setProgress}){
  setProgress(3, 'Decoding audio…');
  logFootage(`No backend detected — running analysis in the browser instead`);
  logFootage(`Ingested <b>${state.rawFiles.length} clip${state.rawFiles.length>1?'s':''}</b> · ${fmtTime(state.totalDuration)} total runtime`);

  for(let i=0;i<state.rawFiles.length;i++){
    const fe = state.rawFiles[i];
    await analyzeSilence(fe);
    if(fe.noAudio){
      logFootage(`Clip ${i+1}: no usable audio track detected — skipping silence detection`);
    } else {
      const gapTime = fe.silences.reduce((a,s)=>a+(s.end-s.start),0);
      logFootage(`Clip ${i+1}: found <b>${fe.silences.length} real silence gap${fe.silences.length===1?'':'s'}</b> (${gapTime.toFixed(1)}s of dead air)`);
    }
    setProgress(8 + ((i+1)/state.rawFiles.length)*32, 'Decoding audio…');
  }

  state.totalSilenceGaps = state.rawFiles.reduce((a,f)=>a+(f.silences?f.silences.length:0),0);
  state.totalSilenceTime = state.rawFiles.reduce((a,f)=>a+(f.silences?f.silences.reduce((s,g)=>s+(g.end-g.start),0):0),0);
  const maxPeak = Math.max(...state.rawFiles.map(f=>f.peak||1), 0.0001);
  state.gain = Math.min(4, Math.max(0.7, 0.9/maxPeak));
  logFootage(`Measured peak level across your clip(s) — applying <b>${state.gain.toFixed(2)}×</b> gain to normalize`);
  setProgress(42, state.hasRef ? 'Reading reference…' : 'Finishing up…');

  if(state.hasRef){
    logDna(`Sampling reference frames — <b>${state.refFile.name}</b>`);
    const result = await analyzeReferenceRhythm(state.refFile, (done,total)=>{
      setProgress(42 + (done/total)*50, `Sampling reference frames… (${done}/${total})`);
    });
    state.refStats = result;
    logDna(`Detected <b>${result.cuts.length} real cut${result.cuts.length===1?'':'s'}</b> in your reference`);
    logDna(`Average shot length: <b>${result.avgShotLen.toFixed(1)}s</b> · ~<b>${result.cutsPerMin}</b> cuts/min`);
    addTag(result.avgShotLen<2.2 ? 'Fast cuts (measured)' : result.avgShotLen<4 ? 'Moderate cuts (measured)' : 'Long takes (measured)');
    addTag(`${result.cutsPerMin} cuts/min (measured)`);
  } else {
    logDna('No reference supplied');
    logDna(`Using EditOS's default pacing for <b>${INTENTS.find(i=>i.id===state.intent)?.name}</b>`);
  }

  state.styleDNA = buildStyleDNA();
  setProgress(100, 'Analysis complete');
  setTimeout(()=>{ buildPlan(); setStage('plan'); }, 500);
}

function gainDisplay(){

function buildPlan(){
  const template = BEAT_TEMPLATES[state.intent] || BEAT_TEMPLATES.custom;
  const total = state.totalDuration || 60;
  state.beats = template.map(b=>({
    name:b.name,
    start: total*b.frac[0],
    end: total*b.frac[1],
    why: b.why,
  }));
  const gapCount = state.totalSilenceGaps||0;
  const gapTime = state.totalSilenceTime||0;
  state.decisions = [
    {title: gapCount>0 ? `Removing ${gapCount} real silence gap${gapCount===1?'':'s'}` : `No significant silence detected`,
     sub: gapCount>0 ? `measured from your actual audio — cutting ${gapTime.toFixed(1)}s of dead air` : `your pacing is already tight — nothing to trim here`},
    {title:`Normalizing audio`, sub:`measured level across your clip(s) — applying ${gainDisplay()} gain`},
    {title: state.styleDNA.measured ? `Cut rhythm: ${state.styleDNA.pace.toLowerCase()} (measured)` : `Cut rhythm: ${state.styleDNA.pace.toLowerCase()} (default)`,
     sub: state.styleDNA.measured ? `matched to your reference — ${state.styleDNA.cutsPerMin} cuts/min, ${state.styleDNA.avgShotLen.toFixed(1)}s avg shot` : `no reference supplied — using a ${state.styleDNA.cutsPerMin} cuts/min default for this intent`},
    {title:`Captions & B-roll`, sub: state.backendAvailable
       ? `not applied to the video yet — real transcription is available via the backend's Whisper model but not wired into render here`
       : `suggested only, not applied — these need speech-to-text and scene detection, which don't run in this browser-only build`},
  ];
}

  render();
  setTimeout(()=>{
    const key = text.trim().toLowerCase();
    let reply = "Got it — I've adjusted the plan accordingly. You'll see the change reflected when it renders.";
    if(key.includes('punch') || key.includes('hook')){
      reply = "Done — sharpened the hook to open right on your highest-energy line, trimming the wind-up before it.";
      state.beats[0].why = "Opens directly on your highest-energy line — the wind-up before it has been trimmed for a sharper start.";
    } else if(key.includes('aggressiv') || key.includes('more cut')){
      state.silenceSensitivity = 'aggressive';
      reply = "I'll lower the silence threshold on the next render, so shorter pauses get cut too — expect a noticeably tighter runtime.";
    } else if(key.includes('b-roll') || key.includes('broll') || key.includes('caption')){
      reply = "Captions and B-roll are suggestion-only in this build — applying them for real would need speech-to-text and scene detection, which don't run in-browser here.";
    } else if(key.includes('slow')){
      const before = state.styleDNA.cutsPerMin;
      state.styleDNA.cutsPerMin = Math.max(6, before-6);
      reply = "Eased the cut rhythm target down — targeting roughly " + state.styleDNA.cutsPerMin + " cuts/min instead of " + before + ".";
      const d = state.decisions.find(d=>d.title.startsWith('Cut rhythm'));
      if(d){ d.title = `Cut rhythm: relaxed`; d.sub = `targeting ~${state.styleDNA.cutsPerMin} cuts/min per your note`; }
    } else if(key.includes('short')){
      reply = "Noted — I'll bias the silence detection to cut a bit harder on the next render, which should bring the runtime down.";
      state.silenceSensitivity = 'aggressive';
    }
    state.chatPlan.push({role:'agent', text:reply});
    render();
  }, 900);
}

/* ============================================================
   RENDERING
   ============================================================ */
function renderRendering(){
  return `
  <div class="render-wrap">
    <div class="scope-panel">
      <canvas id="renderScope"></canvas>
      <div class="scope-label"><span class="scope-dot"></span>Processing</div>
    </div>
    <h2>EditOS is editing.</h2>
    <p id="renderSub">Actually cutting your footage in-browser, at real playback speed — this isn't a mockup.</p>
    <div class="render-progress">
      <div class="progress-track"><div class="progress-fill" id="renderFill" style="width:0%"></div></div>
      <div class="progress-caption"><span id="renderStatus">Starting…</span><span id="renderPct">0%</span></div>
    </div>
  </div>`;
}

async function runRenderSequence(){
  drawIdleWave(document.getElementById('renderScope'));
  const fill = document.getElementById('renderFill');
  const pct = document.getElementById('renderPct');
  const status = document.getElementById('renderStatus');
  const sub = document.getElementById('renderSub');
  function setProgress(p,label){
    fill.style.width = Math.round(p)+'%'; pct.textContent = Math.round(p)+'%';
    if(label) status.textContent = label;
  }

  if(state.backendAvailable && state.backendJobId){
    sub.textContent = 'Real ffmpeg cut + concat + loudness normalize running on the backend — real mp4 output.';
    setProgress(10, 'Rendering on backend…');
    try{
      const r = await fetch(BACKEND_URL+'/render', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({job_id: state.backendJobId, burn_captions:false, gain_db: state.gainDb||0})
      });
      if(!r.ok){
        const errBody = await r.json().catch(()=>({}));
        throw new Error(errBody.error || ('render failed: '+r.status));
      }
      const data = await r.json();
      state.finalVideoUrl = BACKEND_URL + data.video_url;
      state.newDuration = state.rawFiles.reduce((a,f)=>a+(computeKeepSegments(f.realDuration||f.duration, f.silences||[])||[]).reduce((s,g)=>s+(g.end-g.start),0),0);
      setProgress(100, 'Done — real mp4 ready');
      setTimeout(()=>{ buildLedger(); setStage('result'); }, 500);
      return;
    }catch(err){
      console.error('backend render failed, falling back to browser', err);
      sub.textContent = `Backend render failed (${err.message}) — falling back to in-browser export.`;
      state.backendAvailable = false;
      renderTopbar();
    }
  }

  if(state.silenceSensitivity==='aggressive'){
    sub.textContent = 'Re-checking silence with a lower threshold, as requested…';
    for(const fe of state.rawFiles){
      if(!fe.noAudio) await analyzeSilence(fe, {thresholdMult:0.32, minDur:0.35});
    }
    state.totalSilenceGaps = state.rawFiles.reduce((a,f)=>a+(f.silences?f.silences.length:0),0);
    state.totalSilenceTime = state.rawFiles.reduce((a,f)=>a+(f.silences?f.silences.reduce((s,g)=>s+(g.end-g.start),0):0),0);
  }

  state.rawFiles.forEach(f=>{
    f.keepSegments = computeKeepSegments(f.realDuration||f.duration, f.silences||[]);
    f.gain = state.gain || 1;
  });

  if(!supportsExport()){
    sub.textContent = "Your browser doesn't support in-browser video export (needs captureStream + MediaRecorder) — showing your original footage with the real cut list instead. Try Chrome, Edge, or Firefox for a full export.";
    setProgress(100, 'Skipped — unsupported browser');
    state.finalVideoUrl = state.rawFiles[0] ? state.rawFiles[0].url : '';
    state.newDuration = state.rawFiles.reduce((a,f)=>a+(f.keepSegments||[]).reduce((s,g)=>s+(g.end-g.start),0),0);
    setTimeout(()=>{ buildLedger(); setStage('result'); }, 900);
    return;
  }

  setProgress(2, 'Preparing export…');
  try{
    const {url} = await exportEditedVideos(state.rawFiles, (done,total)=>{
      setProgress(5 + (done/total)*90, `Cutting… (${done}/${total} segments)`);
    });
    state.finalVideoUrl = url;
  }catch(err){
    console.error('export failed', err);
    sub.textContent = "Export hit a snag in this browser — showing your original footage instead. The cut list below is still real.";
    state.finalVideoUrl = state.rawFiles[0] ? state.rawFiles[0].url : '';
  }
  state.newDuration = state.rawFiles.reduce((a,f)=>a+(f.keepSegments||[]).reduce((s,g)=>s+(g.end-g.start),0),0);
  setProgress(100, 'Done');
  setTimeout(()=>{ buildLedger(); setStage('result'); }, 500);
}

/* ============================================================
   RESULT
   ============================================================ */
function buildLedger(){
  const cuts = [];
  state.rawFiles.forEach((f,idx)=>{
    (f.silences||[]).forEach(s=> cuts.push({start:s.start, end:s.end, file: state.rawFiles.length>1 ? idx+1 : null}));
  });
  const usedBackend = state.backendAvailable && state.finalVideoUrl && state.finalVideoUrl.startsWith(BACKEND_URL);
  state.ledger = {
    originalDuration: state.totalDuration||0,
    newDuration: state.newDuration!=null ? state.newDuration : state.totalDuration||0,
    cuts,
    gain: state.gain||1,
    gainLabel: gainDisplay(),
    refStats: state.refStats||null,
    exportReal: !!state.finalVideoUrl && (usedBackend || supportsExport()),
    viaBackend: !!usedBackend,
  };
}

function renderResult(){
  const L = state.ledger;
  const cutsHtml = L.cuts.length
    ? L.cuts.map(c=>`<li><span class="tc">${c.file?`clip ${c.file} · `:''}${fmtTime(c.start)}–${fmtTime(c.end)}</span> silence removed</li>`).join('')
    : `<li>No significant silence found</li>`;

  const chatMsgs = state.chatResult.map(m=>`<div class="chat-bubble ${m.role}">${m.text}</div>`).join('');
  const realBadge = L.exportReal
    ? `<span class="rstat">${L.viaBackend ? 'Real export — via backend (ffmpeg, real mp4)' : 'Real export — re-cut in your browser'}</span>`
    : `<span class="rstat">Preview — export unsupported in this browser</span>`;

  return `
  <div class="container result-wrap">
    <div class="result-head">
      <div>
        <span class="step-eyebrow" style="display:block;margin-bottom:10px;">STEP 4 · RESULT</span>
        <h2>Your edit is ready.</h2>
        <div class="result-stats">
          <span class="rstat"><span class="strike">${fmtTime(L.originalDuration)}</span> → <b>${fmtTime(L.newDuration)}</b> final runtime</span>
          ${realBadge}
        </div>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-ghost" id="backToPlan">Back to plan</button>
        <button class="btn btn-primary" id="downloadBtn">Download
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>
        </button>
      </div>
    </div>

    <div class="player-shell">
      <div style="position:relative;">
        <video class="player-video" id="resultVideo" src="${state.finalVideoUrl||''}" playsinline></video>
      </div>
      <div class="player-controls">
        <button class="play-btn" id="playBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
        <span class="time-txt" id="curTime">00:00</span>
        <div class="scrubber" id="scrubber"><div class="scrubber-fill" id="scrubFill"></div></div>
        <span class="time-txt" id="durTime">${fmtTime(L.newDuration)}</span>
      </div>
    </div>

    <div class="section-title">What EditOS actually did <small>Measured from your real footage — the numbers below aren't a mockup.</small></div>
    <div class="improve-grid">
      <div class="improve-card">
        <div class="icard-top"><div class="icard-icon" style="background:var(--surface-3);">✂️</div><div class="icard-title">Silence removed</div></div>
        <div class="icard-count">${L.cuts.length}</div>
        <ul>${cutsHtml}</ul>
      </div>
      <div class="improve-card">
        <div class="icard-top"><div class="icard-icon" style="background:var(--surface-3);">⏱</div><div class="icard-title">Runtime</div></div>
        <div class="icard-count">${fmtTime(L.newDuration)}</div>
        <ul><li>Down from ${fmtTime(L.originalDuration)}</li></ul>
      </div>
      <div class="improve-card">
        <div class="icard-top"><div class="icard-icon" style="background:var(--surface-3);">🔊</div><div class="icard-title">Audio gain</div></div>
        <div class="icard-count">${L.gainLabel || L.gain.toFixed(2)+'×'}</div>
        <ul><li>Applied to normalize your measured level</li></ul>
      </div>
      ${L.refStats ? `
      <div class="improve-card">
        <div class="icard-top"><div class="icard-icon" style="background:var(--surface-3);">✦</div><div class="icard-title">Style match</div></div>
        <div class="icard-count">${L.refStats.cutsPerMin}/min</div>
        <ul><li>Measured from your reference — ${L.refStats.avgShotLen.toFixed(1)}s avg shot</li></ul>
      </div>` : ''}
    </div>

    <div class="revise-panel">
      <h3 style="font-family:'Syne',sans-serif; font-size:16px; margin-bottom:16px;">💬 Ask for changes</h3>
      <div class="chat-box">
        <div class="chat-msgs" id="resultChatMsgs">${chatMsgs}</div>
        <div class="chat-suggest">
          <button class="chip-sm" data-suggest-r="Cut more aggressively">Cut more aggressively</button>
          <button class="chip-sm" data-suggest-r="Keep more of the pauses">Keep more of the pauses</button>
          <button class="chip-sm" data-suggest-r="Boost the volume more">Boost the volume more</button>
        </div>
        <div class="chat-input-row">
          <input class="chat-input" id="resultChatInput" placeholder="Tell EditOS what to change...">
          <button class="chat-send" id="resultChatSend">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="result-actions">
      <button class="btn btn-ghost" id="startOverBtn">Start a new edit</button>
    </div>
  </div>`;
}

function handleResultChat(text){
  if(!text.trim()) return;
  state.chatResult.push({role:'user', text});
  render();
  setTimeout(()=>{
    let reply = "Noted — that needs a fresh render pass to actually apply. Head back to the plan and regenerate to hear/see it.";
    const key = text.toLowerCase();
    if(key.includes('aggressiv') || key.includes('more cut')){
      reply = "I can cut harder — go back to the plan and I'll lower the silence threshold before the next real render.";
    } else if(key.includes('pause') || key.includes('less cut')){
      reply = "Got it — I'll raise the silence threshold so more natural pauses survive on the next render.";
    } else if(key.includes('volume') || key.includes('loud') || key.includes('boost')){
      reply = "I can push the gain higher — just know it risks clipping past a certain point. I'll apply a stronger gain on the next render.";
    }
    state.chatResult.push({role:'agent', text:reply});
    render();
  }, 800);
}

/* ============================================================
   EVENT BINDING
   ============================================================ */
function bindStageEvents(){
  if(state.stage==='landing'){
    document.getElementById('startBtn').onclick = ()=> setStage('upload');
    drawIdleWave(document.getElementById('landingRing'));
  }

  if(state.stage==='upload'){
    const rawDrop = document.getElementById('rawDrop');
    const refDrop = document.getElementById('refDrop');
    const rawInput = document.getElementById('rawInput');
    const refInput = document.getElementById('refInput');

    ['browseRaw','browseRawMore'].forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.onclick = ()=> rawInput.click();
    });
    const browseRef = document.getElementById('browseRef');
    if(browseRef) browseRef.onclick = ()=> refInput.click();

    rawInput.onchange = e=> addRawFiles(e.target.files);
    refInput.onchange = e=> setRefFile(e.target.files[0]);

    ;[[rawDrop,addRawFiles,true],[refDrop,f=>setRefFile(f[0]),false]].forEach(([el,fn])=>{
      el.addEventListener('dragover', e=>{ e.preventDefault(); el.classList.add('drag'); });
      el.addEventListener('dragleave', ()=> el.classList.remove('drag'));
      el.addEventListener('drop', e=>{
        e.preventDefault(); el.classList.remove('drag');
        fn(e.dataTransfer.files);
      });
    });

    document.querySelectorAll('[data-remove-raw]').forEach(btn=>{
      btn.onclick = ()=>{ state.rawFiles.splice(+btn.dataset.removeRaw,1); state.totalDuration = state.rawFiles.reduce((a,f)=>a+(f.duration||0),0); render(); };
    });
    const removeRef = document.getElementById('removeRef');
    if(removeRef) removeRef.onclick = ()=>{ state.refFile=null; state.hasRef=false; render(); };

    document.getElementById('goalInput').oninput = e=> state.goalText = e.target.value;

    document.querySelectorAll('[data-intent]').forEach(btn=>{
      btn.onclick = ()=>{ state.intent = btn.dataset.intent; render(); };
    });

    const toAnalyze = document.getElementById('toAnalyze');
    if(toAnalyze) toAnalyze.onclick = ()=>{
      if(state.rawFiles.length===0 || !state.intent) return;
      state.styleDNA = null;
      setStage('analyzing');
    };
  }

  if(state.stage==='analyzing'){
    runAnalyzingSequence();
  }

  if(state.stage==='plan'){
    const sendBtn = document.getElementById('planChatSend');
    const input = document.getElementById('planChatInput');
    sendBtn.onclick = ()=>{ const v=input.value; input.value=''; handlePlanChat(v); };
    input.onkeydown = e=>{ if(e.key==='Enter'){ const v=input.value; input.value=''; handlePlanChat(v); } };
    document.querySelectorAll('[data-suggest]').forEach(btn=>{
      btn.onclick = ()=> handlePlanChat(btn.dataset.suggest);
    });
    document.getElementById('toRender').onclick = ()=> setStage('rendering');
    const msgBox = document.getElementById('planChatMsgs');
    if(msgBox) msgBox.scrollTop = msgBox.scrollHeight;
  }

  if(state.stage==='rendering'){
    runRenderSequence();
  }

  if(state.stage==='result'){
    const video = document.getElementById('resultVideo');
    const playBtn = document.getElementById('playBtn');
    const scrubber = document.getElementById('scrubber');
    const scrubFill = document.getElementById('scrubFill');
    const curTime = document.getElementById('curTime');

    if(video){
      playBtn.onclick = ()=>{
        if(video.paused){ video.play(); playBtn.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>'; }
        else { video.pause(); playBtn.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'; }
      };
      video.ontimeupdate = ()=>{
        const p = video.duration? (video.currentTime/video.duration*100):0;
        scrubFill.style.width = p+'%';
        curTime.textContent = fmtTime(video.currentTime);
      };
      scrubber.onclick = e=>{
        const r = scrubber.getBoundingClientRect();
        const pct = (e.clientX-r.left)/r.width;
        if(video.duration) video.currentTime = pct*video.duration;
      };
    }

    document.getElementById('backToPlan').onclick = ()=> setStage('plan');
    document.getElementById('startOverBtn').onclick = ()=>{
      if(confirm('Start a new edit? This clears your current project.')){
        Object.assign(state, {stage:'landing', rawFiles:[], refFile:null, goalText:'', intent:null, hasRef:false, styleDNA:null, refStats:null, totalDuration:0, totalSilenceGaps:0, totalSilenceTime:0, gain:1, gainDb:0, newDuration:0, finalVideoUrl:null, beats:[], decisions:[], chatPlan:[], chatResult:[], ledger:null, backendJobId:null, planReasoning:null});
        setStage('landing');
      }
    };
    document.getElementById('downloadBtn').onclick = ()=>{
      if(state.finalVideoUrl){
        const a = document.createElement('a');
        a.href = state.finalVideoUrl;
        a.download = state.ledger && state.ledger.viaBackend ? 'EditOS_Export.mp4'
                    : state.ledger && state.ledger.exportReal ? 'EditOS_Export.webm'
                    : (state.rawFiles[0] ? state.rawFiles[0].name : 'EditOS_Export');
        if(state.ledger && state.ledger.viaBackend) a.target = '_blank';
        a.click();
        toast(state.ledger && state.ledger.exportReal ? 'Downloading your real edit' : 'Downloading original footage');
      } else toast('Nothing to export yet');
    };

    const sendBtn = document.getElementById('resultChatSend');
    const input = document.getElementById('resultChatInput');
    sendBtn.onclick = ()=>{ const v=input.value; input.value=''; handleResultChat(v); };
    input.onkeydown = e=>{ if(e.key==='Enter'){ const v=input.value; input.value=''; handleResultChat(v); } };
    document.querySelectorAll('[data-suggest-r]').forEach(btn=>{
      btn.onclick = ()=> handleResultChat(btn.dataset.suggestR);
    });
    const msgBox = document.getElementById('resultChatMsgs');
    if(msgBox) msgBox.scrollTop = msgBox.scrollHeight;
  }
}

/* ---------------- theme toggle ---------------- */
document.getElementById('themeToggle').onclick = ()=>{
  const html = document.documentElement;
  const next = html.getAttribute('data-theme')==='light' ? 'dark' : 'light';
  if(next==='light') html.setAttribute('data-theme','light'); else html.removeAttribute('data-theme');
};

/* ---------------- init ---------------- */
renderTopbar();
render();
checkBackend().then(()=> renderTopbar());
setInterval(()=>{ if(state.stage==='landing'||state.stage==='upload') checkBackend().then(()=>renderTopbar()); }, 8000);
</script>
